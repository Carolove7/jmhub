name: Update mirror addresses

on:
  schedule:
    # Run twice an hour, deliberately avoiding the top of the hour.
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Discover and check mirrors
        run: node scripts/check-mirror.js

      - name: Commit changed mirror data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/mirror.json

          if git diff --cached --quiet; then
            echo "Mirror data unchanged."
            exit 0
          fi

          git commit -m "chore: update mirror addresses"
          git push
